<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hiroba News Smart Monitor</title>
<style>

:root { --dim: .55; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; color: #eee; overflow: hidden;
  font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", "Meiryo UI", sans-serif;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
a { color: #8cf; }

#bg { position: fixed; inset: 0; z-index: 0; background: #000; }
.bgl { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 1s; }
.bgl.show { opacity: 1; }
#bg::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,var(--dim)); }
body.hide-cursor, body.hide-cursor * { cursor: none !important; }

#pages { position: relative; z-index: 1; display: flex; width: 100%; height: 100%;
  overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
#pages.drag { scroll-snap-type: none; }
#pages::-webkit-scrollbar, .page::-webkit-scrollbar { display: none; }
.page { flex: 0 0 100%; height: 100%; scroll-snap-align: start; scroll-snap-stop: always;
  padding: 3vmin 3vmin 8vmin; overflow-x: hidden; overflow-y: auto; scrollbar-width: none; position: relative; }
h2 { font-size: 3vmin; color: #8cb; margin: 0 0 1.5vmin; font-weight: normal; }
#upd { position: fixed; z-index: 2; right: 3vmin; bottom: 2vmin; font-size: 2vmin; color: #9ab; pointer-events: none; }
.msg { color: #abc; font-size: 3vmin; white-space: pre-line; word-break: break-all; }

#p-home { display: grid; grid-template-columns: 1fr 1fr; gap: 2vmin; }
#left { display: flex; flex-direction: column; min-width: 0; }
#main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
#clock { font-size: 20vmin; font-weight: bold; line-height: 1; }
#sec { font-size: 8vmin; font-weight: normal; color: #9ab; margin-left: 1.5vmin; }
#date { font-size: 5vmin; color: #bcd; margin: 1vmin 0 0; }
#era { font-size: 3vmin; color: #9ab; margin: .5vmin 0 3vmin; }
#now { font-size: 7vmin; }
#days { margin-top: 1.5vmin; font-size: 3vmin; color: #cde; }
#fx { display: grid; grid-template-columns: auto auto auto; justify-content: start; gap: .4vmin 1.8vmin; margin-top: 1.5vmin; font-size: 2.2vmin; color: #9ab; }
#fx .fxh { grid-column: 1 / -1; }
#fx .fxr { text-align: right; color: #dde; }
.up { color: #2ed573; }
.dn { color: #ff4757; }
#right { min-width: 0; overflow: hidden; }
.headlines { margin: 0; padding: 0; list-style: none; }
#hnews { font-size: 3.4vmin; }
#hnews li { padding: 1.4vmin 0; border-bottom: 1px solid rgba(255,255,255,.15); }
@media (orientation: portrait) {
  #p-home { grid-template-columns: 1fr; grid-auto-rows: min-content; }
  #clock { font-size: 24vmin; }
}

#wxnow { font-size: 7vmin; }
#wxsub { font-size: 2.6vmin; color: #bcd; margin: .5vmin 0 2vmin; }
#hourly { display: flex; margin-bottom: 2.5vmin; }
.hc { flex: 1; text-align: center; font-size: 2.5vmin; color: #cde; }
.hc .ic { font-size: 5vmin; line-height: 1.3; }
.hc .tp { font-size: 3.3vmin; color: #fff; }
.po { color: #7bf; }
#daily { display: flex; flex-wrap: wrap; gap: 1vmin; }
.dc { flex: 1 1 11vmin; text-align: center; background: rgba(255,255,255,.08); border-radius: 1vmin; padding: 1vmin .4vmin; font-size: 2.4vmin; color: #cde; }
.dc .ic { font-size: 5.5vmin; line-height: 1.3; }
.dc .hi, .dc .lo { font-size: 3.6vmin; font-weight: bold; }
.lo { color: #7bf; }
.hi { color: #ff8a80; }

#news { margin: 0; padding: 0; list-style: none; max-width: 140vmin; }
#news li { padding: 1.6vmin 0; border-bottom: 1px solid rgba(255,255,255,.15); font-size: 3.4vmin; cursor: pointer; }
#news .src { font-size: 2.2vmin; color: #8ab; }
#news .more { display: none; margin-top: 1vmin; font-size: 2.6vmin; color: #bcd; }
#news .more a { display: inline-block; margin-top: 1vmin; padding: 1vmin 0; }
#news li.open .more { display: block; }
#news li.open .t { color: #fff; }

#p-music { display: grid; grid-template-columns: 5fr 6fr; gap: 3vmin; }
#mu-now { display: flex; flex-direction: column; justify-content: center; gap: 1.6vmin; min-width: 0; }
#mu-title { font-size: 4.6vmin; font-weight: bold; word-break: break-all; }
#mu-sub { font-size: 2.4vmin; color: #9ab; min-height: 1.3em; word-break: break-all; }
#mu-time { display: flex; justify-content: space-between; font-size: 2.4vmin; color: #9ab; margin-top: -1vmin; }
#mu-ctl { display: flex; gap: 2vmin; align-items: center; }
.btn { background: rgba(255,255,255,.12); border: 0; border-radius: 1.4vmin; font-size: 3.4vmin; min-width: 12vmin; height: 10vmin; padding: 0 2vmin; cursor: pointer; }
.btn:active { background: rgba(255,255,255,.3); }
#mu-play { min-width: 16vmin; background: #5ec4ff; color: #000; font-weight: bold; }
#mu-mode { font-size: 2.6vmin; min-width: 18vmin; }
#mu-now input[type=range] { flex: none; }
#mu-vol { display: flex; align-items: center; gap: 1.5vmin; font-size: 3vmin; }
#mu-vol input[type=range] { flex: 1; }
input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; width: 100%; height: 6vmin; margin: 0; background: transparent; touch-action: none; }
input[type=range]::-webkit-slider-runnable-track { height: 1vmin; border-radius: .5vmin; background: rgba(255,255,255,.3); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 4.4vmin; height: 4.4vmin; margin-top: -1.7vmin; border-radius: 50%; background: #dff; border: 0; }
input[type=range]::-moz-range-track { height: 1vmin; border-radius: .5vmin; background: rgba(255,255,255,.3); }
input[type=range]::-moz-range-thumb { width: 4.4vmin; height: 4.4vmin; border-radius: 50%; background: #dff; border: 0; }
#mu-lib { min-width: 0; display: flex; flex-direction: column; min-height: 0; }
#mu-path { font-size: 2.6vmin; color: #8cb; margin-bottom: 1vmin; word-break: break-all; }
#mu-list { overflow-y: auto; flex: 1; min-height: 0; scrollbar-width: none; }
#mu-list::-webkit-scrollbar { display: none; }
.row { padding: 1.5vmin 1vmin; font-size: 3.2vmin; border-bottom: 1px solid rgba(255,255,255,.12); cursor: pointer; word-break: break-all; }
.row.dir { color: #cde; }
.row.on { color: #5ec4ff; font-weight: bold; }
.row:active { background: rgba(255,255,255,.12); }
@media (orientation: portrait) {
  #p-music { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
  #mu-now { padding-top: 1vmin; }
}

#cmds { display: flex; flex-direction: column; gap: 1.6vmin; max-width: 120vmin; }
.cmd { text-align: left; font-size: 3.6vmin; padding: 2.4vmin 3vmin; border: 0; border-radius: 1.4vmin; background: rgba(255,255,255,.12); cursor: pointer; }
.cmd:active { background: rgba(255,255,255,.3); }
.cmd.arm { background: #a33; }
.cmd:disabled { opacity: .35; }
#cmdstat { font-size: 3vmin; margin-top: 2vmin; min-height: 1.4em; color: #9ab; }
#cmdstat.ok { color: #7d7; }
#cmdstat.ng { color: #f88; }

#dots { position: fixed; z-index: 2; left: 50%; transform: translateX(-50%); bottom: 1vmin; font-size: 0; padding: 0 1.5vmin; border-radius: 4vmin; background: rgba(0,0,0,.45); }
.dot { display: inline-block; width: 4.4vmin; height: 4.4vmin; padding: 1.5vmin; background: rgba(255,255,255,.25); background-clip: content-box; border-radius: 50%; cursor: pointer; }
.dot.on { background-color: #cde; }
#hint { position: fixed; z-index: 2; left: 2vmin; bottom: 1vmin; font-size: 2vmin; color: #9ab; display: none; }
@media (orientation: portrait) { #hint { display: none !important; } }
</style>
</head>
<body>
<div id="bg"><div class="bgl" id="bg0"></div><div class="bgl" id="bg1"></div></div>

<div id="pages">

  <section class="page" id="p-home">
    <div id="left">
      <div id="main">
        <div id="clock"><span id="hm">--:--</span><span id="sec"></span></div>
        <div id="date"></div>
        <div id="era"></div>
        <div id="now" class="msg">天気 取得中...</div>
        <div id="days"></div>
      </div>
      <div id="fx"></div>
    </div>
    <div id="right">
      <ul id="hnews" class="headlines"></ul>
    </div>
  </section>

  <section class="page" id="p-weather">
    <h2 id="wxtitle">天気</h2>
    <div id="wxnow" class="msg">取得中...</div>
    <div id="wxsub"></div>
    <div id="hourly"></div>
    <div id="daily"></div>
  </section>

  <section class="page" id="p-news">
    <h2>ニュース</h2>
    <ul id="news"><li class="msg">取得中...</li></ul>
  </section>

  <section class="page" id="p-music">
    <div id="mu-now">
      <div id="mu-title">曲を選んでください</div>
      <div id="mu-sub"></div>
      <input type="range" id="mu-seek" min="0" max="1000" value="0" aria-label="再生位置">
      <div id="mu-time"><span id="mu-cur">0:00</span><span id="mu-dur">0:00</span></div>
      <div id="mu-ctl">
        <button class="btn" id="mu-prev" aria-label="前の曲">|◀</button>
        <button class="btn" id="mu-play" aria-label="再生/一時停止">▶</button>
        <button class="btn" id="mu-next" aria-label="次の曲">▶|</button>
        <button class="btn" id="mu-mode">順番</button>
      </div>
      <div id="mu-vol"><span>音量</span><input type="range" id="mu-volume" min="0" max="100" value="80" aria-label="音量"></div>
    </div>
    <div id="mu-lib">
      <div id="mu-path"></div>
      <div id="mu-list"><div class="msg">読み込み中...</div></div>
    </div>
  </section>

  <section class="page" id="p-command">
    <h2>コマンド</h2>
    <div id="cmds"></div>
    <div id="cmdstat"></div>
  </section>

</div>
<div id="dots"></div>
<div id="upd"></div>
<div id="hint">[[タップで全画面, 左右にスワイプ ドラッグ 矢印キー]]</div>

<script>
"use strict";
const CFG = window.CFG || {};
const $ = id => document.getElementById(id);
const WEEK = ["日", "月", "火", "水", "木", "金", "土"];
const ETOS = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];
const JIKKAN = ["甲", "乙", "丙", "丁", "戊", "己", "庚", "辛", "壬", "癸"];
const visible = () => document.visibilityState === "visible";

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function fill(parent, nodes) {
  parent.textContent = "";
  const f = document.createDocumentFragment();
  nodes.forEach(n => f.appendChild(n));
  parent.appendChild(f);
}
const v = x => (x == null ? "-" : x);
const safeUrl = u => (/^https?:\/\//i.test(u || "") ? u : "");
const hhmm = d => String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");

document.documentElement.style.setProperty("--dim", CFG.bgDim);
if (CFG.hideCursor) document.body.classList.add("hide-cursor");

function wx(c) {
  if (c === 0) return "☀️ 快晴";
  if (c <= 2)  return "🌤 晴れ";
  if (c === 3) return "☁️ くもり";
  if (c <= 48) return "🌫 霧";
  if (c <= 57) return "🌦 霧雨";
  if (c <= 67) return "🌧 雨";
  if (c <= 77) return "❄️ 雪";
  if (c <= 82) return "🌧 にわか雨";
  if (c <= 86) return "❄️ にわか雪";
  return "⛈ 雷雨";
}
const icon = c => wx(c).split(" ")[0];

const ALL = ["home", "weather", "news", "music", "command"];
const order = CFG.pages && CFG.pages.length ? CFG.pages : ["home"];
ALL.forEach(n => {
  const s = $("p-" + n), i = order.indexOf(n);
  if (i < 0) s.style.display = "none"; else s.style.order = i;
});
const pagesEl = $("pages");
let active = 0;

const dots = order.map((name, i) => {
  const d = el("span", "dot");
  d.addEventListener("click", () => go(i));
  $("dots").appendChild(d);
  return d;
});
if (order.length < 2) $("dots").style.display = "none";

function go(i) {
  i = Math.max(0, Math.min(order.length - 1, i));
  pagesEl.scrollTo({ left: i * pagesEl.clientWidth, behavior: "smooth" });
}
function setActive(i) {
  if (i === active || i < 0 || i >= order.length) return;
  active = i;
  paintDots();
  lastNav = Date.now();
  updLabel();
  tick();
  if (order[i] === "music") muRefreshUI();
  visit();
}
function paintDots() { dots.forEach((d, n) => { d.className = n === active ? "dot on" : "dot"; }); }
paintDots();

let raf = 0;
pagesEl.addEventListener("scroll", () => {
  if (raf) return;
  raf = requestAnimationFrame(() => { raf = 0; setActive(Math.round(pagesEl.scrollLeft / pagesEl.clientWidth)); });
}, { passive: true });

let lastNav = 0;
const curPage = () => Math.round(pagesEl.scrollLeft / pagesEl.clientWidth);

function edge(dir) {
  if (Date.now() - lastNav < 600) return;
  if (dir > 0) location.reload();
  else if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
}
function step(dir) {
  const i = curPage() + dir;
  if (i >= order.length) edge(1); else if (i < 0) edge(-1); else go(i);
}
document.addEventListener("keydown", e => {
  if (e.repeat || (e.target && e.target.tagName === "INPUT")) return;
  if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
});

const EDGE_PX = () => Math.min(160, innerWidth * 0.15);
function edgeSwipe(dx) {
  const max = pagesEl.scrollWidth - pagesEl.clientWidth;
  if (dx < 0 && pagesEl.scrollLeft >= max - 2) edge(1);
  else if (dx > 0 && pagesEl.scrollLeft <= 2) edge(-1);
}
let tx = 0, ty = 0, tOn = false;
document.addEventListener("touchstart", e => {
  tOn = e.touches.length === 1 && !e.target.closest("input");
  if (tOn) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }
}, { passive: true });
document.addEventListener("touchend", e => {
  if (!tOn) return;
  tOn = false;
  const t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
  if (Math.abs(dx) >= EDGE_PX() && Math.abs(dx) > Math.abs(dy) * 1.5) edgeSwipe(dx);
}, { passive: true });

(function mouseDrag() {
  let st = null, suppress = false;
  document.addEventListener("mousedown", e => {
    if (e.button !== 0 || e.target.closest("input, a")) return;
    st = { x: e.clientX, y: e.clientY, sl: pagesEl.scrollLeft, axis: null, sc: null, top: 0 };
    for (let n = e.target; n && n !== pagesEl; n = n.parentElement) {
      if (n.scrollHeight > n.clientHeight + 1 && /auto|scroll/.test(getComputedStyle(n).overflowY)) { st.sc = n; st.top = n.scrollTop; break; }
    }
  });
  document.addEventListener("mousemove", e => {
    if (!st) return;
    const dx = e.clientX - st.x, dy = e.clientY - st.y;
    if (!st.axis) {
      if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
      st.axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
      if (st.axis === "x") pagesEl.classList.add("drag");
    }
    if (st.axis === "x") pagesEl.scrollLeft = st.sl - dx;
    else if (st.sc) st.sc.scrollTop = st.top - dy;
  });
  document.addEventListener("mouseup", e => {
    if (!st) return;
    const s = st; st = null;
    if (!s.axis) return;
    suppress = true;
    setTimeout(() => { suppress = false; }, 0);
    if (s.axis !== "x") return;
    pagesEl.classList.remove("drag");
    const dx = e.clientX - s.x, w = pagesEl.clientWidth, base = Math.round(s.sl / w), dir = dx < 0 ? 1 : -1;
    if (Math.abs(dx) >= EDGE_PX() && (base + dir < 0 || base + dir >= order.length)) { go(base); edge(dir); return; }
    let target = Math.round(pagesEl.scrollLeft / w);
    if (Math.abs(dx) > 50) target = dir > 0 ? Math.max(target, base + 1) : Math.min(target, base - 1);
    go(target);
  });
  document.addEventListener("click", e => { if (suppress) { e.stopPropagation(); e.preventDefault(); } }, true);
})();
window.addEventListener("resize", () => { pagesEl.scrollLeft = active * pagesEl.clientWidth; if (D.news) fitHomeNews(); });

let lastClock = "", lastDate = "", lastSec = "", clockT = 0;
function tick() {
  clearTimeout(clockT);
  if (!visible()) return; 
  const d = new Date();
  const hm = hhmm(d);
  if (hm !== lastClock) { $("hm").textContent = hm; lastClock = hm; }
  const ds = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日(${WEEK[d.getDay()]})`;
  if (ds !== lastDate) {
    const y = d.getFullYear(), ry = y - 2018;
    $("date").textContent = ds; lastDate = ds;
    $("era").textContent = `令和${ry === 1 ? "元" : ry}年 / 干支 ${JIKKAN[(y - 4) % 10]}${ETOS[(y - 4) % 12]}`;
  }
  const secs = CFG.showSeconds && order[active] === "home";
  if (secs) {
    const s = String(d.getSeconds()).padStart(2, "0");
    if (s !== lastSec) { $("sec").textContent = s; lastSec = s; }
  }
  clockT = setTimeout(tick, (secs ? 1000 - (Date.now() % 1000) : 60000 - (Date.now() % 60000)) + 5);
}

const D = {}, TS = {}, ERR = {};

const UPD_KEY = { home: "weather", weather: "weather", news: "news" };
function updLabel() {
  const key = UPD_KEY[order[active]], p = $("upd");
  if (!key || !TS[key]) { p.textContent = ""; return; }
  const old = Date.now() - TS[key] > 2 * 60 * 60 * 1000;
  p.textContent = "更新 " + hhmm(new Date(TS[key])) + (old ? " ⚠古い情報" : "");
}
const errText = (key, base) => base + (ERR[key] ? "\n(" + ERR[key] + ")" : "");

function dayLabel(iso, i) {
  const d = new Date(iso + "T00:00:00");
  return i === 0 ? "今日" : `${d.getDate()}日(${WEEK[d.getDay()]})`;
}

function renderWeather() {
  const w = D.weather;
  $("wxtitle").textContent = "天気 - " + (CFG.city || "");
  if (!w) {
    $("now").className = $("wxnow").className = "msg";
    $("now").textContent = $("wxnow").textContent = errText("weather", "天気を取得できません");
    return;
  }
  const c = w.cur;
  const head = `${wx(c.code)} ${v(c.t)}℃`;
  $("now").className = $("wxnow").className = "";
  $("now").textContent = $("wxnow").textContent = head;
  const t = w.daily[0];
  $("days").textContent = t ? `今日 ${v(t.min)}/${v(t.max)}℃ ☂${v(t.pop)}%` : "";

  $("wxsub").textContent = `体感 ${v(c.feel)}℃ ・ 湿度 ${v(c.hum)}% ・ 風 ${v(c.wind)}m/s ・ 日の出 ${w.sun.rise} / 日の入 ${w.sun.set}`;
  fill($("hourly"), w.hourly.map(h => {
    const cell = el("div", "hc");
    cell.append(el("div", "", h.h + "時"), el("div", "ic", icon(h.code)), el("div", "tp", v(h.t) + "°"), el("div", "po", "☂" + v(h.pop) + "%"));
    return cell;
  }));
  fill($("daily"), w.daily.map((d, i) => {
    const card = el("div", "dc");
    card.append(el("div", "", dayLabel(d.d, i)), el("div", "ic", icon(d.code)), el("div", "hi", v(d.max) + "°"),
      el("div", "lo", v(d.min) + "°"), el("div", "po", "☂" + v(d.pop) + "%"));
    return card;
  }));
  updLabel();
}

function fitHomeNews() {
  const box = $("right").getBoundingClientRect();
  let hide = false;
  $("hnews").querySelectorAll("li").forEach(li => { li.style.display = ""; });
  $("hnews").querySelectorAll("li").forEach(li => {
    if (!hide && li.getBoundingClientRect().bottom > box.bottom + 0.5) hide = true;
    if (hide) li.style.display = "none";
  });
}

function renderNews() {
  const n = D.news;
  if (!n) {
    const m = el("li", "msg", errText("news", "ニュースを取得できません"));
    fill($("news"), [m]);
    fill($("hnews"), [el("li", "msg", errText("news", "ニュースを取得できません"))]);
    return;
  }
  fill($("hnews"), n.slice(0, CFG.homeNews).map(x => el("li", "", x.t)));
  fitHomeNews();
  fill($("news"), n.map(x => {
    const li = el("li");
    li.appendChild(el("div", "t", x.t));
    if (x.s) li.appendChild(el("div", "src", x.s));
    const more = el("div", "more");
    if (x.d) more.appendChild(el("div", "", x.d));
    const url = safeUrl(x.u);
    if (url) {
      const a = el("a", "", "記事を開く ↗");
      a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
      more.appendChild(a);
    }
    li.appendChild(more);
    return li;
  }));
  updLabel();
}
$("news").addEventListener("click", e => {
  if (e.target.closest("a")) return;
  const li = e.target.closest("li");
  if (!li) return;
  const was = li.classList.contains("open");
  $("news").querySelectorAll("li.open").forEach(x => x.classList.remove("open"));
  if (!was) li.classList.add("open");
});

function renderFx() {
  const box = $("fx");
  if (!CFG.fx) return;
  if (!D.fx) { box.textContent = "為替を取得できません"; return; }
  const cells = [el("span", "fxh", "為替(前週比)")];
  D.fx.forEach(f => {
    cells.push(el("span", "", f.pair), el("span", "fxr", f.rate.toFixed(2)));
    if (f.prev) {
      const pct = (f.rate - f.prev) / f.prev * 100;
      cells.push(el("span", pct > 0 ? "up" : pct < 0 ? "dn" : "", `${pct > 0 ? "▲+" : pct < 0 ? "▼" : "─"}${pct.toFixed(2)}%`));
    } else cells.push(el("span"));
  });
  fill(box, cells);
}

const RENDER = { weather: renderWeather, news: renderNews, fx: renderFx };

async function load(keys) {
  let ok = false;
  try {
    const r = await fetch("/api/data?k=" + keys.join(","), { cache: "no-store" });
    const j = await r.json();
    keys.forEach(k => {
      ERR[k] = (j._err || {})[k] || null;
      if (j[k] !== undefined) { D[k] = j[k]; TS[k] = (j._ts[k] || 0) * 1000; ok = true; }
    });
  } catch (e) { keys.forEach(k => { ERR[k] = "サーバーに接続できません"; }); }
  keys.forEach(k => RENDER[k]());
  return ok;
}

const PG = {
  home:    { fn: () => load(CFG.fx ? ["weather", "news", "fx"] : ["weather", "news"]), every: Math.min(CFG.weatherMin, CFG.newsMin) * 60000 },
  weather: { fn: () => load(["weather"]),         every: CFG.weatherMin * 60000 },
  news:    { fn: () => load(["news"]),            every: CFG.newsMin * 60000 },
  music:   { fn: () => loadMusic(),               every: 10 * 60000 },
};
const lastLoad = {};
function visit() {
  const name = order[active], p = PG[name];
  if (!p || !visible() || Date.now() - (lastLoad[name] || 0) < p.every) return;
  lastLoad[name] = Date.now();
  Promise.resolve(p.fn()).then(ok => { if (!ok) lastLoad[name] = Date.now() - p.every + 60000; });
}

let bgBag = [], bgFront = 0, bgLast = "", bgT = 0;
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
async function bgNext() {
  clearTimeout(bgT);
  if (!CFG.bgEnabled || !visible()) return;
  let got = false;
  try {
    if (!bgBag.length) {
      const r = await fetch("/api/images", { cache: "no-store" });
      bgBag = shuffle(await r.json());
      const last = bgBag.length - 1;
      if (last > 0 && bgBag[last] === bgLast) [bgBag[0], bgBag[last]] = [bgBag[last], bgBag[0]];
    }
    const name = bgBag.pop();
    if (name) {
      const url = "/image/" + encodeURIComponent(name);
      await new Promise((ok, ng) => { const im = new Image(); im.onload = ok; im.onerror = ng; im.src = url; });
      const next = $("bg" + (1 - bgFront)), cur = $("bg" + bgFront);
      next.style.backgroundImage = `url("${url}")`;
      next.classList.add("show");
      cur.classList.remove("show");
      bgFront = 1 - bgFront;
      bgLast = name;
      got = true;
    }
  } catch (e) { got = bgBag.length > 0; }
  if (CFG.bgInterval > 0) bgT = setTimeout(bgNext, CFG.bgInterval * 1000 * (got ? 1 : 10));
}

const audio = new Audio();
audio.preload = "metadata";
audio.volume = CFG.volume;
$("mu-volume").value = Math.round(CFG.volume * 100);
const MODES = [["seq", "順番"], ["rand", "ランダム"], ["one", "1曲リピート"]];
const mu = { tree: [], cwd: [], queue: [], qi: -1, cur: null, mode: Math.max(0, MODES.findIndex(m => m[0] === CFG.mode)), seeking: false, errs: 0, rows: new Map() };
const fmt = s => (isFinite(s) ? Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0") : "0:00");
const nameOf = f => f.n.replace(/\.[^.]+$/, "");
const musicActive = () => order[active] === "music";

function nodeAt(path) { let list = mu.tree; for (const n of path) { const d = list.find(x => x.c && x.n === n); if (!d) return list; list = d.c; } return list; }
function collect(list, out = []) {  // そのフォルダの曲 → サブフォルダの順
  list.forEach(x => { if (!x.c) out.push(x); });
  list.forEach(x => { if (x.c) collect(x.c, out); });
  return out;
}
const dirOf = f => f.p.split("/").slice(0, -1).join("/");

function renderList() {
  const list = nodeAt(mu.cwd);
  const rows = [];
  mu.rows.clear();
  $("mu-path").textContent = "♪ " + (mu.cwd.length ? mu.cwd.join(" / ") : "ライブラリ");
  if (mu.cwd.length) {
    const r = el("div", "row dir", "../ 上の階層へ");
    r.addEventListener("click", () => { mu.cwd.pop(); renderList(); });
    rows.push(r);
  }
  list.filter(x => x.c).forEach(d => {
    const r = el("div", "row dir", `📁 ${d.n} (${collect(d.c).length})`);
    r.addEventListener("click", () => { mu.cwd.push(d.n); renderList(); $("mu-list").scrollTop = 0; });
    rows.push(r);
  });
  list.filter(x => !x.c).forEach(f => {
    const r = el("div", "row" + (mu.cur && mu.cur.p === f.p ? " on" : ""), nameOf(f));
    r.addEventListener("click", () => muPlay(f, collect(list)));
    mu.rows.set(f.p, r);
    rows.push(r);
  });
  if (!rows.length) rows.push(el("div", "msg", "音楽ファイルがありません"));
  fill($("mu-list"), rows);
}

function muPlay(f, queue) {
  if (queue) { mu.queue = queue; }
  mu.qi = mu.queue.findIndex(x => x.p === f.p);
  if (mu.qi < 0) { mu.queue = [f]; mu.qi = 0; }
  mu.cur = f;
  audio.src = "/music/" + f.p.split("/").map(encodeURIComponent).join("/");
  audio.play().catch(() => {});
  muRefreshUI();
  mu.rows.forEach((r, p) => r.classList.toggle("on", p === f.p));
}
function muStep(dir, auto) {
  const n = mu.queue.length;
  if (!n) return;
  if (MODES[mu.mode][0] === "rand" && n > 1) {
    let i; do { i = Math.floor(Math.random() * n); } while (i === mu.qi);
    return muPlay(mu.queue[i]);
  }
  const i = mu.qi + dir;
  if (i >= 0 && i < n) return muPlay(mu.queue[i]);
  muPlay(mu.queue[(i + n) % n]);
}
function muRefreshUI() {
  if (!musicActive()) return;
  const f = mu.cur;
  $("mu-title").textContent = f ? nameOf(f) : "曲を選んでください";
  $("mu-sub").textContent = f ? dirOf(f) : "";
  $("mu-play").textContent = audio.paused ? "▶" : "❚❚";
  $("mu-mode").textContent = MODES[mu.mode][1];
  muProgress();
}
function muProgress() {
  if (!musicActive() || mu.seeking) return;
  const d = audio.duration;
  $("mu-seek").value = d ? Math.round(audio.currentTime / d * 1000) : 0;
  $("mu-cur").textContent = fmt(audio.currentTime);
  $("mu-dur").textContent = fmt(d);
}
audio.addEventListener("timeupdate", muProgress);
audio.addEventListener("play", muRefreshUI);
audio.addEventListener("pause", muRefreshUI);
audio.addEventListener("playing", () => { mu.errs = 0; });
audio.addEventListener("ended", () => muStep(1, true));
audio.addEventListener("error", () => { if (mu.cur && ++mu.errs < mu.queue.length) muStep(1, true); });

$("mu-play").addEventListener("click", () => {
  if (!mu.cur) { const all = collect(nodeAt(mu.cwd)); if (all.length) muPlay(all[0], all); return; }
  if (audio.paused) audio.play().catch(() => {}); else audio.pause();
});
$("mu-prev").addEventListener("click", () => { if (audio.currentTime > 3) audio.currentTime = 0; else muStep(-1); });
$("mu-next").addEventListener("click", () => muStep(1));
$("mu-mode").addEventListener("click", () => {
  mu.mode = (mu.mode + 1) % MODES.length;
  audio.loop = MODES[mu.mode][0] === "one";
  muRefreshUI();
});
audio.loop = MODES[mu.mode][0] === "one";
$("mu-volume").addEventListener("input", e => { audio.volume = e.target.value / 100; });
$("mu-seek").addEventListener("input", () => { mu.seeking = true; $("mu-cur").textContent = fmt(audio.duration * $("mu-seek").value / 1000); });
$("mu-seek").addEventListener("change", () => {
  if (audio.duration) audio.currentTime = audio.duration * $("mu-seek").value / 1000;
  mu.seeking = false;
  $("mu-seek").blur();
});
$("mu-volume").addEventListener("change", () => $("mu-volume").blur());

async function loadMusic() {
  try {
    const tree = await (await fetch("/api/music", { cache: "no-store" })).json();
    mu.tree = tree;
    renderList();
    return true;
  } catch (e) {
    fill($("mu-list"), [el("div", "msg", "読み込み失敗: " + e.message)]);
    return false;
  }
}

let cmdLocked = false, armed = -1, armT = 0, statT = 0;
const cmdBtns = [];
(function buildCommands() {
  const box = $("cmds");
  if (!CFG.commands || !CFG.commands.length) { box.appendChild(el("div", "msg", "config.toml の [[commands]] にコマンドを追加してください")); return; }
  CFG.commands.forEach((c, i) => {
    const b = el("button", "cmd", c.name);
    b.addEventListener("click", () => tapCommand(i, b));
    cmdBtns.push(b);
    box.appendChild(b);
  });
})();
function resetArm() { clearTimeout(armT); if (armed >= 0) { cmdBtns[armed].classList.remove("arm"); cmdBtns[armed].textContent = CFG.commands[armed].name; } armed = -1; }
function status(text, cls) {
  const s = $("cmdstat");
  clearTimeout(statT);
  s.textContent = text; s.className = cls || "";
  if (cls) statT = setTimeout(() => { s.textContent = ""; s.className = ""; }, 4000);
}
async function tapCommand(i, btn) {
  if (cmdLocked) return;
  const c = CFG.commands[i];
  if (c.confirm && armed !== i) {
    resetArm();
    armed = i;
    btn.classList.add("arm");
    btn.textContent = "もう一度タップで実行: " + c.name;
    armT = setTimeout(resetArm, 4000);
    return;
  }
  resetArm();
  cmdLocked = true;
  cmdBtns.forEach(b => { b.disabled = true; });
  status("実行中: " + c.name);
  try {
    const r = await fetch("/api/run", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ i }) });
    const j = await r.json();
    if (j.ok) status("✓ 実行開始: " + c.name, "ok"); else status("✗ エラー: " + (j.error || "不明"), "ng");
  } catch (e) { status("✗ 通信エラー", "ng"); }
  setTimeout(() => { cmdLocked = false; cmdBtns.forEach(b => { b.disabled = false; }); }, 2000);
}

let lastAct = Date.now();
const act = () => { lastAct = Date.now(); };
["touchstart", "pointerdown", "keydown"].forEach(t => document.addEventListener(t, act, { passive: true, capture: true }));
document.addEventListener("scroll", act, { passive: true, capture: true });
setInterval(() => {
  visit();
  if (CFG.idleReturn > 0 && active !== 0 && audio.paused && Date.now() - lastAct > CFG.idleReturn * 1000) go(0);
}, 30000);

document.addEventListener("visibilitychange", () => {
  if (visible()) { tick(); visit(); if (CFG.bgInterval > 0) bgNext(); keepAwake(); }
});

let wakeLock = null;
async function keepAwake() {
  if (!CFG.wakeLock || !("wakeLock" in navigator)) return;
  try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
}
if (CFG.fullscreenOnTap) {
  $("hint").style.display = "block";
  document.body.addEventListener("click", async () => {
    try { if (!document.fullscreenElement) await document.documentElement.requestFullscreen(); } catch (e) {}
    keepAwake();
  });
  document.addEventListener("fullscreenchange", () => { $("hint").style.display = document.fullscreenElement ? "none" : "block"; });
} else {
  document.body.addEventListener("click", keepAwake, { once: true });
}
keepAwake();

tick();
visit();
bgNext();
if (order.includes("music") && order[0] !== "music") { lastLoad.music = Date.now(); loadMusic(); } 
</script>
</body>
</html>
